name: Validate ClausePilot
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild standalone UI and run 20 contract rules tests
        run: npm run check
      - name: Verify published artifact matches modular sources
        run: git diff --exit-code -- index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and browser test tools
        run: |
          python -m pip install pymupdf playwright
          python -m playwright install --with-deps chromium
      - name: Test PDF retrieval and contract isolation
        run: python -m unittest discover -s tests -p test_contract_index.py -v
      - name: Test browser flows and 10 viewport widths
        run: python tests/ui-smoke.py
